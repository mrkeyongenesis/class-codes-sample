name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/cicd-demo-app
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Build Docker Image
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image locally
        run: docker build -t cicd-demo-app:${{ github.sha }} .
      
      - name: Test Docker image builds successfully
        run: docker run --rm cicd-demo-app:${{ github.sha }} python -c "import flask; print('✅ Flask imported successfully')"
      
      - name: Check image size
        run: |
          SIZE=$(docker images cicd-demo-app:${{ github.sha }} --format "{{.Size}}")
          echo "Image size: $SIZE"
          if [ -z "$SIZE" ]; then echo "Image creation failed"; exit 1; fi

  # Job 2: Run Tests
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run linting (basic syntax check)
        run: python -m py_compile app.py test_app.py
      
      - name: Run unit tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        run: |
          pytest test_app.py -v --tb=short --cov=. --cov-report=xml
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # Job 3: Security Scanning
  security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check for security issues with bandit
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Basic security check
        run: |
          echo "✅ Security scan completed"

  # Job 4: Push to Docker Hub (only on main branch)
  push-image:
    needs: [build, test, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:latest -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
      
      - name: Login to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      
      - name: Push to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "✅ Pushed image: ${{ env.IMAGE_NAME }}:latest"
      
      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  # Job 5: Notify Status
  notify:
    runs-on: ubuntu-latest
    needs: [build, test, security]
    if: always()
    
    steps:
      - name: Determine status
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All checks passed!"
            echo "STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Some checks failed"
            echo "STATUS=failure" >> $GITHUB_ENV
          fi
      
      - name: Print status
        run: echo "Pipeline Status: ${{ env.STATUS }}"
      
      - name: Create status badge
        run: |
          echo "# CI/CD Pipeline Status: ${{ env.STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY

  # Job 6: Deployment Simulation (Optional)
  deploy:
    needs: [build, test, security, push-image]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Simulate deployment
        run: |
          echo "🚀 Deployment Simulation"
          echo "Would deploy: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Version: 1.0.0"
          echo "Region: US-EAST-1"
          echo "Status: ✅ Ready to deploy"
      
      - name: Post-deployment verification
        run: |
          echo "✅ Health check would be performed"
          echo "✅ Smoke tests would run"
          echo "✅ Monitoring would be enabled"
